<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkly — Questão</title>
  <script>(function(){try{if(localStorage.getItem('sparkly_tema')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/sparkly.css">
  <link rel="stylesheet" href="/static/css/aluno-desafio.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">Sparkly<span class="dot">.</span></div>
  <div class="gami-nav">
    <span class="gami-badge gami-coracoes" id="navCoracoes">❤️ —</span>
    <span class="gami-badge gami-pontos" id="navPontos">⭐ —</span>
    <span class="gami-badge gami-sparks" id="navSparks">⚡ —</span>
  </div>
  <div class="d-flex align-center gap-2">
    <span data-theme-switch-slot></span>
    <a href="/aluno-trilhas" class="btn btn-outline btn-sm">← Voltar</a>
  </div>
</nav>

<div id="telaLoading">
  <div class="spinner"></div>
  <span>Carregando questão...</span>
</div>

<div id="telaBloqueada" style="display:none;">
  <div class="bloqueio-wrap">
    <div class="bloqueio-icone">💔</div>
    <div class="bloqueio-titulo">Você está sem corações</div>
    <p class="bloqueio-texto">Aguarde a recarga automática ou visite a loja para recarregar agora usando seus pontos.</p>
    <div class="bloqueio-acoes">
      <a href="/aluno-loja" class="btn btn-primary btn-lg btn-full">Ir para a loja</a>
      <a href="/aluno-trilhas" class="btn btn-outline btn-full">Praticar uma questão já concluída</a>
    </div>
  </div>
</div>

<div id="telaQuestao" style="display:flex;">
  <div class="questao-wrap">
    <div class="q-meta">
      <span class="badge" id="tipoBadge"></span>
    </div>
    <div class="q-nome" id="qNome"></div>
    <div class="q-enunciado" id="qEnunciado"></div>

    <div class="alternativas" id="alternativasWrap"></div>

    <textarea class="input" id="respostaLivre" placeholder="Digite sua resposta aqui..."
      style="display:none;margin-bottom:20px;"></textarea>

    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-titulo" id="feedbackTitulo"></div>
      <div class="feedback-detalhe" id="feedbackDetalhe"></div>
      <div class="feedback-timer" id="feedbackTimer">
        <div class="feedback-timer-fill" id="feedbackTimerFill"></div>
      </div>
    </div>

    <div class="acoes">
      <button class="btn btn-primary btn-confirmar btn-lg" id="btnConfirmar" onclick="confirmar()" disabled>
        Confirmar resposta
      </button>
      <button class="btn btn-primary btn-confirmar btn-lg" id="btnContinuar" onclick="continuarAgora()" style="display:none;">
        Continuar →
      </button>
    </div>
  </div>
</div>

<div id="telaResultado" style="display:none;">
  <div class="resultado-wrap">
    <div class="resultado-emoji" id="resEmoji"></div>
    <div class="resultado-titulo" id="resTitulo"></div>
    <div class="resultado-sub" id="resSub"></div>
    <div class="resultado-barra">
      <div class="resultado-barra-fill" id="resBarraFill"></div>
    </div>
    <div class="resultado-barra-label" id="resBarraLabel"></div>
    <div class="resultado-gamificacao" id="resGamificacao"></div>
    <div class="resultado-acoes">
      <a href="/aluno-trilhas"   class="btn btn-primary btn-full btn-lg">Ver todas as questões</a>
      <a href="/aluno-dashboard" class="btn btn-outline btn-full">Dashboard</a>
    </div>
  </div>
</div>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/gamificacao.js"></script>
  <script src="/static/js/aluno-desafio.js"></script>
</body>
</html>
