<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkly — Cadastro</title>
  <script>(function(){try{if(localStorage.getItem('sparkly_tema')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/sparkly.css">
  <link rel="stylesheet" href="/static/css/cadastro.css">
</head>
<body>
<div class="public-theme-bar" data-theme-switch-slot></div>
<div class="wrap">
  <div class="owl">🐝</div>
  <div class="logo-big">Sparkly</div>
  <div class="tagline">Crie sua conta grátis!</div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="alert alert-danger" id="erroMsg" style="display:none;margin-bottom:14px;"></div>
  <div class="alert alert-success" id="sucessoMsg" style="display:none;margin-bottom:14px;"></div>

  <div class="form-group">
    <label>Nome Completo</label>
    <input type="text" class="input" id="nome" placeholder="Seu nome" oninput="atualizarBarra()">
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" class="input" id="email" placeholder="seu@email.com" oninput="atualizarBarra()">
  </div>
  <div class="form-group">
    <label>Usuário</label>
    <input type="text" class="input" id="usuarioNovo" placeholder="seu_usuario" oninput="atualizarBarra()">
  </div>
  <div class="form-group">
    <label>Senha</label>
    <input type="password" class="input" id="senhaNova" placeholder="Mínimo 3 caracteres" oninput="atualizarBarra()">
  </div>
  <div class="form-group">
    <label>Confirmar Senha</label>
    <input type="password" class="input" id="senhaConfirmar" placeholder="Repita a senha" oninput="atualizarBarra()">
  </div>

  <div class="form-group">
    <label>Utiliza nome social?</label>
    <div class="toggle-group">
      <button type="button" class="toggle-btn" id="btnNomeSocialSim" onclick="definirUsaNomeSocial(true)">Sim</button>
      <button type="button" class="toggle-btn selecionado" id="btnNomeSocialNao" onclick="definirUsaNomeSocial(false)">Não</button>
    </div>
  </div>
  <div class="form-group" id="grupoNomeSocial" style="display:none;">
    <label>Nome Social</label>
    <input type="text" class="input" id="nomeSocial" placeholder="Como você gostaria de ser chamado(a)" oninput="atualizarBarra()">
  </div>

  <div class="form-group">
    <label>Gênero</label>
    <div class="radio-group">
      <label class="radio-option"><input type="radio" name="genero" value="masculino" onchange="atualizarGenero()"> Masculino</label>
      <label class="radio-option"><input type="radio" name="genero" value="feminino" onchange="atualizarGenero()"> Feminino</label>
      <label class="radio-option"><input type="radio" name="genero" value="nao-binario" onchange="atualizarGenero()"> Não-binário</label>
      <label class="radio-option"><input type="radio" name="genero" value="prefiro-nao-dizer" onchange="atualizarGenero()"> Prefiro não dizer</label>
      <label class="radio-option"><input type="radio" name="genero" value="personalizado" onchange="atualizarGenero()"> Adicionar gênero personalizado</label>
    </div>
  </div>
  <div class="form-group" id="grupoGeneroPersonalizado" style="display:none;">
    <label>Gênero Personalizado</label>
    <input type="text" class="input" id="generoPersonalizado" placeholder="Informe seu gênero" oninput="atualizarBarra()">
  </div>

  <button class="btn btn-primary btn-full btn-lg mt-2" onclick="realizarCadastro()">Criar conta</button>
  <p class="text-center text-muted mt-2" style="font-size:0.82rem;font-weight:600;">
    Já tem conta? <a href="/login">Fazer login</a>
  </p>
</div>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/cadastro.js"></script>
</body>
</html>
