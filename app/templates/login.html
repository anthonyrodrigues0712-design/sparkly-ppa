<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkly — Login</title>
  <script>(function(){try{if(localStorage.getItem('sparkly_tema')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/sparkly.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<div class="public-theme-bar" data-theme-switch-slot></div>
<div class="wrap">
  <div class="owl">🐝</div>
  <div class="logo-big">Sparkly</div>
  <div class="tagline">Aprenda mais, avance mais!</div>

  <div class="tabs">
    <button class="tab active" onclick="trocarTab('aluno',this)">Aluno</button>
    <button class="tab"        onclick="trocarTab('professor',this)">Professor</button>
  </div>

  <!-- ALUNO -->
  <div class="painel active" id="painelAluno">
    <div class="alert alert-danger erro" id="erroAluno"></div>
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" class="input" id="alunoUsuario" placeholder="seu_usuario">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" class="input" id="alunoSenha" placeholder="••••••">
    </div>
    <button class="btn btn-primary btn-full btn-lg" onclick="loginAluno()">Entrar</button>
    <p class="text-center text-muted mt-2" style="font-size:0.82rem;font-weight:600;">
      Não tem conta? <a href="/cadastro">Cadastre-se grátis</a>
    </p>
  </div>

  <!-- PROFESSOR -->
  <div class="painel" id="painelProfessor">
    <div class="alert alert-danger erro" id="erroProfessor"></div>
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" class="input" id="profUsuario" placeholder="prof_usuario">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" class="input" id="profSenha" placeholder="••••••">
    </div>
    <button class="btn btn-primary btn-full btn-lg" onclick="loginProf()">Entrar como Professor</button>
     <p class="text-center text-muted mt-2" style="font-size:0.82rem;font-weight:600;">
      Não tem conta? <a href="/cadastro">Cadastre-se grátis</a>
    </p>
  </div>
</div>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
